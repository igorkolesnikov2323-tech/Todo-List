<!doctype html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="todo/reset.css">
    <title>To do List</title>
    </head>
    <body>
    <!-- snippet https://codemyui.com/todo-list-code-snippet-with-emoji/# -->
    <div class="wrapper">
        <div class="container">
        <img id="logo" src="img/to-do-list.png" alt="logo" />
        <h1 id="title">Enjoy your Wednesday ☕️😌</h1>
        <div class="input__box">
            <input id="input" type="text" placeholder="✍️Add item..." />
            <h1 id="input__img">+</h1>
            <button class="input__button"></button>
        </div>
        <div class="tasks__container">
            <ul class="tasks__list"></ul>
            
        </div>
        </div>
    </div>
    <script src="todo/main.js"></script>
    </body>
</html>
